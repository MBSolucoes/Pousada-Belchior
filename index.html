<script>
'use strict';

/* ─── aliases ─────────────────────────────────────────────────────────── */
const { useState, useMemo, useEffect, useCallback } = React;
const ce = React.createElement;

/* ─── constantes ─────────────────────────────────────────────────────── */
const CASAS = [
  { nome:'Casa 01', cor:'#3B82F6', bg:'#EFF6FF' },
  { nome:'Casa 02', cor:'#10B981', bg:'#ECFDF5' },
  { nome:'Casa 03', cor:'#F59E0B', bg:'#FFFBEB' },
  { nome:'Casa 04', cor:'#EF4444', bg:'#FEF2F2' },
];
const STORAGE_KEY = 'pousada_belchior_v1';

/* ── NUVEM (Firebase) ─────────────────────────────────────────────────────
   Cole abaixo o firebaseConfig do projeto. Enquanto for null, o app funciona só neste aparelho.
   Exemplo:  const FIREBASE_CONFIG = { apiKey:'...', authDomain:'xxx.firebaseapp.com', projectId:'xxx', appId:'...' };  */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA7KixS6OlxwPqew85mEus1ezbGG-EoNjA",
  authDomain: "pousada-belchior.firebaseapp.com",
  projectId: "pousada-belchior",
  storageBucket: "pousada-belchior.firebasestorage.app",
  messagingSenderId: "439216267552",
  appId: "1:439216267552:web:e13f84732d1f77f5657745"
};
const EMAIL_APP   = 'pousada@belchior.app';     /* usuário único criado no Firebase Authentication */
const derivar     = s => s + '#belchior';       /* o Firebase exige 6+ caracteres: a senha digitada ganha esse sufixo */
const NUVEM       = !!FIREBASE_CONFIG;
const COLECAO     = 'pousada_alugueis';
const MIGRADO_KEY = 'pousada_belchior_migrado';
let fb = null;
const FB_JS = [
  'https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js',
  'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js',
  'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js'
];
/* carrega o Firebase em segundo plano (em paralelo, executando em ordem) enquanto a tela da senha já aparece */
const fbPromise = !NUVEM ? Promise.resolve() : new Promise((ok, falha) => {
  let faltam = FB_JS.length;
  FB_JS.forEach(u => {
    const t = document.createElement('script');
    t.src = u; t.async = false;
    t.onload = () => { if (--faltam === 0) ok(); };
    t.onerror = () => falha(new Error('sdk'));
    document.head.appendChild(t);
  });
}).then(() => {
  firebase.initializeApp(FIREBASE_CONFIG);
  fb = { auth: firebase.auth(), db: firebase.firestore() };
  fb.db.enablePersistence({ synchronizeTabs:true }).catch(() => {});
}).catch(() => { fb = null; });
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ─── helpers ────────────────────────────────────────────────────────── */
const brl = v => (v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
/* "1500" => 1500 | "1.500,50" => 1500.5 | "R$ 1.500,00" => 1500 */
function parseValor(s) {
  s = String(s || '').replace(/[^\d.,]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : Math.round(n * 100) / 100;
}
/* celular: digita só números e vira (11) 91234-5678 */
function formatCel(s) {
  const d = String(s || '').replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
}
const D       = s => new Date(s + 'T00:00:00Z');
const dias    = (a, b) => (a && b) ? Math.round((D(b) - D(a)) / 864e5) + 1 : 0; /* 1º dia 00:00 até último dia 23:59 */
const dataBR  = s => s.split('-').reverse().join('/');
const totalR  = r => r.pago > 0 ? r.pago : Math.round(dias(r.de, r.ate) * r.diaria * 100) / 100;   /* aluguel pago direto: o total é o valor pago */
const restaR  = r => r.quit ? 0 : Math.max(0, totalR(r) - r.sinal);
const p2      = n => String(n).padStart(2, '0');
/* bloco Total / Sinal(Pago) / Saldo: 3 colunas iguais, rótulo em cima e valor embaixo, alinhados à esquerda */
function blocoValores(r) {
  const corResta = r.quit ? '#059669' : '#dc2626';
  const col = (rot, val, st) => ce('div', { key:rot, style:{ minWidth:0, ...st } },
    ce('div', null, rot), ce('div', { style:{ whiteSpace:'nowrap' } }, val));
  return ce('div', { style:{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', columnGap:8, fontSize:12, color:'#444', textAlign:'left' } },
    col('Total', brl(totalR(r))),
    col(r.pago > 0 ? 'Pago' : 'Sinal', brl(r.pago > 0 ? r.pago : r.sinal)),
    col('Saldo', brl(restaR(r)), { fontWeight:700, color:corResta }));
}

/* ─── storage ─────────────────────────────────────────────────────────── */
function loadDados() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (_) {}
  return [];
}

/* ─── Toast ───────────────────────────────────────────────────────────── */
function Toast({ msg, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2400);
    return () => clearTimeout(t);
  }, [onDone]);
  return ce('div', { className:'toast' }, msg);
}

/* ─── campo de texto/valor ───────────────────────────────────────────── */
const inputStyle = { width:'100%', padding:'10px 12px', borderRadius:9, border:'2px solid #e5e7eb', fontSize:14, outline:'none', background:'#fff' };
/* campo de senha com o olho para mostrar/ocultar o que foi digitado */
const CampoSenha = React.forwardRef(function CampoSenha({ style, ...rest }, ref) {
  const [ver, setVer] = useState(false);
  const mb = style && style.marginBottom != null ? style.marginBottom : 0;
  const icone = ce('svg', { width:22, height:22, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
    ce('path', { d:'M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z' }),
    ce('circle', { cx:12, cy:12, r:3 }),
    ver && ce('path', { d:'M3 3l18 18' }));
  return ce('div', { style:{ position:'relative', width:'100%', marginBottom:mb } },
    ce('input', { ...rest, ref, type: ver ? 'text' : 'password', autoComplete:'off', autoCapitalize:'none', autoCorrect:'off', spellCheck:false,
      style:{ ...style, marginBottom:0, paddingLeft:46, paddingRight:46 } }),
    ce('button', { type:'button', 'aria-label': ver ? 'Ocultar senha' : 'Mostrar senha',
      onPointerDown:e => e.preventDefault(),   /* não tira o foco do campo ao tocar no olho */
      onClick:() => setVer(v => !v),
      style:{ position:'absolute', right:6, top:0, bottom:0, width:40, border:'none', background:'transparent', color: ver ? '#1a3a5c' : '#6b7280', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', padding:0 } }, icone));
});

/* quadro de assinatura em tela cheia, deitado: o celular continua em pé e o quadro aparece girado (vire o aparelho para a esquerda).
   Se o aparelho já estiver deitado, o quadro aparece normal. Devolve um PNG transparente, recortado rente ao traço. */
function PadAssinatura({ onSalvar, onCancelar }) {
  const ov = React.useRef(null), cv = React.useRef(null), desenhando = React.useRef(false), ultimo = React.useRef(null);
  const [vazio, setVazio] = useState(true);
  const [dim, setDim] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    const med = () => { if (!ov.current) return; const r = ov.current.getBoundingClientRect(); setDim({ w: Math.round(r.width), h: Math.round(r.height) }); };
    med(); window.addEventListener('resize', med);
    return () => window.removeEventListener('resize', med);
  }, []);
  const giro = dim.h >= dim.w;   /* em pé: gira o quadro 90°; deitado: não gira */
  /* o bitmap tem o dobro do tamanho do quadro na tela (traço mais nítido); se o tamanho mudar, o quadro recomeça */
  useEffect(() => {
    const c = cv.current; if (!c || !c.offsetWidth) return;
    if (c.dataset.w !== String(c.offsetWidth) || c.dataset.h !== String(c.offsetHeight)) {
      c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2;
      c.dataset.w = c.offsetWidth; c.dataset.h = c.offsetHeight; setVazio(true);
    }
  }, [dim.w, dim.h]);
  /* ponto da tela → ponto do quadro (desfaz a rotação quando o quadro está girado) */
  const pos = e => {
    const c = cv.current;
    const lx = giro ? e.clientY : e.clientX, ly = giro ? dim.w - e.clientX : e.clientY;
    return { x:(lx - c.offsetLeft) * c.width / c.offsetWidth, y:(ly - c.offsetTop) * c.height / c.offsetHeight };
  };
  const ini = e => {
    e.preventDefault();
    try { cv.current.setPointerCapture(e.pointerId); } catch (_) {}
    desenhando.current = true; const p = pos(e); ultimo.current = p;
    const g = cv.current.getContext('2d'); g.fillStyle = '#111'; g.beginPath(); g.arc(p.x, p.y, 3.4, 0, 7); g.fill();
    setVazio(false);
  };
  const mov = e => {
    if (!desenhando.current) return;
    e.preventDefault();
    const g = cv.current.getContext('2d'), p = pos(e);
    g.strokeStyle = '#111'; g.lineWidth = 6.8; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(ultimo.current.x, ultimo.current.y); g.lineTo(p.x, p.y); g.stroke();
    ultimo.current = p;
  };
  const fim = () => { desenhando.current = false; };
  const limpar = () => { const c = cv.current; c.getContext('2d').clearRect(0, 0, c.width, c.height); setVazio(true); };
  const salvar = () => {
    const c = cv.current, W = c.width, H = c.height, d = c.getContext('2d').getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = 0, y1 = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < x0) return;
    const m = 8; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
    const w = x1 - x0 + 1, h = y1 - y0 + 1, k = Math.min(1, 220 / h);   /* limita a altura para o arquivo ficar leve */
    const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(w * k)); o.height = Math.max(1, Math.round(h * k));
    o.getContext('2d').drawImage(c, x0, y0, w, h, 0, 0, o.width, o.height);
    onSalvar(o.toDataURL('image/png'));
  };
  const bt = (bg, cor, borda) => ({ padding:'8px 16px', borderRadius:999, border:'2px solid ' + borda, background:bg, color:cor, fontSize:14, fontWeight:700, cursor:'pointer' });
  const palco = ce('div', { style:{ position:'absolute', top:0, left:0, width: giro ? dim.h : dim.w, height: giro ? dim.w : dim.h,
      transformOrigin:'0 0', transform: giro ? 'translateX(' + dim.w + 'px) rotate(90deg)' : 'none',
      background:'#fff', display:'flex', flexDirection:'column', padding:10, boxSizing:'border-box', touchAction:'none' } },
    ce('div', { style:{ display:'flex', alignItems:'center', gap:8, marginBottom:8 } },
      ce('div', { style:{ flex:1, fontSize:13, fontWeight:700, color:'#1a3a5c' } }, giro ? '✍️ Vire o celular para a esquerda e assine' : '✍️ Assine com o dedo'),
      ce('button', { type:'button', onClick:onCancelar, style:bt('#fff', '#555', '#e5e7eb') }, 'Cancelar'),
      ce('button', { type:'button', onClick:limpar, style:bt('#fff', '#1a3a5c', '#bfdbfe') }, 'Limpar'),
      ce('button', { type:'button', onClick:salvar, disabled:vazio, style:{ ...bt('#1a3a5c', '#fff', '#1a3a5c'), opacity: vazio ? .4 : 1 } }, 'Salvar')),
    ce('canvas', { ref:cv, onPointerDown:ini, onPointerMove:mov, onPointerUp:fim, onPointerCancel:fim,
      style:{ flex:1, minHeight:0, width:'100%', display:'block', touchAction:'none', border:'2px dashed #94a3b8', borderRadius:12, boxSizing:'border-box',
        backgroundColor:'#fff', backgroundImage:'linear-gradient(to bottom, transparent calc(72% - 1px), #cbd5e1 calc(72% - 1px), #cbd5e1 72%, transparent 72%)' } }));
  return ReactDOM.createPortal(ce('div', { ref:ov, style:{ position:'fixed', inset:0, zIndex:3000, background:'#fff', overflow:'hidden', touchAction:'none' } }, palco), document.body);
}

function Campo({ label, children, full, centro }) {
  return ce('label', { style:{ display:'block', gridColumn: full ? '1 / -1' : 'auto' } },
    ce('div', { style:{ fontSize:11, color:'#888', fontWeight:700, marginBottom:3, textAlign: centro ? 'center' : 'left' } }, label),
    children
  );
}

/* ─── card de uma casa ───────────────────────────────────────────────── */
/* dias livres/ocupados de uma casa em um mês (1º ao último dia, inclusive) */
function vagasMes(regs, ano, mes) {
  const nDias = new Date(Date.UTC(ano, mes + 1, 0)).getUTCDate();
  const ocu = new Set();
  regs.forEach(r => {
    for (let t = D(r.de); t <= D(r.ate); t = new Date(+t + 864e5))
      if (t.getUTCFullYear() === ano && t.getUTCMonth() === mes) ocu.add(t.getUTCDate());
  });
  const faixas = [];
  for (let d = 1; d <= nDias; d++) if (!ocu.has(d)) {
    const l = faixas[faixas.length - 1];
    if (l && l[1] === d - 1) l[1] = d; else faixas.push([d, d]);
  }
  return { nDias, ocu, faixas, livres: nDias - ocu.size };
}
const FORM0 = { nome:'', cel:'', de:'', ate:'', dia:'', sin:'' };
const formDe = r => ({ nome:r.nome, cel:r.cel || '', de:r.de, ate:r.ate, dia:brl(r.diaria), sin: r.sinal ? brl(r.sinal) : '' });
function CasaCard({ idx, regs, modo, pre, onAdd, onEdit, onQuit, onDel, onAbrir, onVoltar, onRecibo }) {
  const c = CASAS[idx];
  const [f, setF] = useState(pre && pre.edit ? formDe(pre.edit) : pre ? { ...FORM0, de: pre.de, ate: pre.ate } : FORM0);
  const [editId, setEditId] = useState(pre && pre.edit ? pre.edit.id : null);
  const [formAberto, setFormAberto] = useState(!!(pre && (pre.edit || pre.de)));   /* o formulário só aparece em tela própria */
  const [conflito, setConflito] = useState(null);
  const diaRef = React.useRef(null);
  const [cal, setCal] = useState(null);   /* calendário próprio: { modo, ini, cm, msg } */
  const calRef = React.useRef(null); calRef.current = cal;
  const formRef = React.useRef(null);
  const topoRef = React.useRef(null);
  const fechar = () => { setFormAberto(false); setEditId(null); setF(FORM0); setCal(null); };
  const abrirForm = () => { setEditId(null); setF(FORM0); setFormAberto(true); };

  /* botão voltar do celular com o formulário aberto: fecha só o formulário */
  useEffect(() => {
    window.__pbForm = formAberto;
    const ev = () => { if (calRef.current) setCal(null); else fechar(); };   /* voltar do celular: fecha o calendário primeiro */
    window.addEventListener('pb-fechar-form', ev);
    return () => { window.__pbForm = false; window.removeEventListener('pb-fechar-form', ev); };
  }, [formAberto]);
  /* ao abrir ou fechar o formulário, a tela volta ao topo */
  useEffect(() => { const el = topoRef.current && topoRef.current.closest('.scroll-area'); if (el) el.scrollTop = 0; }, [formAberto]);
  /* se o aluguel em edição foi excluído, fecha o formulário */
  useEffect(() => { if (editId && !regs.some(r => r.id === editId)) fechar(); }, [regs, editId]);

  const hj = new Date();
  const [ym, setYm] = useState(hj.getFullYear() * 12 + hj.getMonth());
  useEffect(() => {
    if (/^\d{4}-\d{2}-\d{2}$/.test(f.de)) { const [y, m] = f.de.split('-'); setYm(+y * 12 + (+m - 1)); }
  }, [f.de]);
  const vano = Math.floor(ym / 12), vmes = ym % 12;
  const vg   = vagasMes(regs, vano, vmes);
  const iso  = d => vano + '-' + p2(vmes + 1) + '-' + p2(d);
  const escolher = fx => setF(prev => ({ ...prev, de: iso(fx[0]), ate: iso(fx[1]) }));
  /* faixa livre: na tela inicial e na lista da casa abre o lançamento já com as datas; dentro do lançamento só preenche */
  const clickFaixa = fx => modo === 'resumo' ? onAbrir(idx, iso(fx[0]), iso(fx[1])) : formAberto ? escolher(fx) : (escolher(fx), setEditId(null), setFormAberto(true));
  const navBtn = { width:34, height:30, borderRadius:8, border:'2px solid #e5e7eb', background:'#fff', color:'#1a3a5c', fontSize:16, fontWeight:700, cursor:'pointer' };
  const set  = k => e => setF(prev => ({ ...prev, [k]: e.target.value }));
  const money = k => ({
    value: f[k], inputMode:'decimal', enterKeyHint: 'done',
    onChange: set(k),
    onFocus: () => { const n = parseValor(f[k]); if (f[k]) setF(p => ({ ...p, [k]: n ? String(n).replace('.', ',') : '' })); },
    onBlur:  () => { if (f[k]) setF(p => ({ ...p, [k]: brl(parseValor(f[k])) })); },
  });
  const n      = Math.max(0, dias(f.de, f.ate));
  const diaria = parseValor(f.dia), sinal = parseValor(f.sin);
  const diariaEf = diaria;
  const total  = Math.round(n * diariaEf * 100) / 100;
  const pago   = (!sinal && total > 0) ? total : 0;   /* sem sinal: o pago é automático = dias × diária (campo só de leitura) */
  const resta  = pago ? 0 : Math.max(0, total - sinal);

  const lancar = () => {
    if (!f.nome.trim())            return onAdd(null, 'Informe o nome de quem alugou');
    if (!f.de || !f.ate || n < 1)  return onAdd(null, 'A data final não pode ser anterior à inicial');
    if (!diariaEf)                 return onAdd(null, 'Informe o valor da diária');
    if (sinal > total)             return onAdd(null, 'O sinal não pode ser maior que o total');
    const outro = regs.find(r => r.id !== editId && f.de <= r.ate && f.ate >= r.de);
    if (outro) { setConflito(outro); return; }
    const campos = { nome: f.nome.trim(), cel: f.cel.trim(), de: f.de, ate: f.ate, diaria: diariaEf, sinal: pago ? 0 : sinal, pago: pago || 0 };
    if (editId) { onEdit(editId, campos); fechar(); return; }
    onAdd({ id: Date.now().toString(36), casa: idx, ...campos, quit: pago > 0 || sinal >= total });
    fechar();
  };

  /* Enter do celular: Nome → Celular → calendário → Diária (o Sinal só é tocado se houver) */
  const enterRef = React.useRef(0);
  const onEnter = e => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    e.preventDefault();
    if (e.repeat || Date.now() - enterRef.current < 350) return;   /* um toque no Enter = um passo só */
    enterRef.current = Date.now();
    const k = e.target.dataset.k;
    if (k === 'nome') { const el = formRef.current.querySelector('[data-k="cel"]'); if (el) el.focus(); }

/* ─── recibos ─────────────────────────────────────────────────────────── */
function extenso(v) {
  const U = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const Dz = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const C = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999 = n => {
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, p = [];
    if (c) p.push(C[c]);
    if (r) { if (r < 20) p.push(U[r]); else { const d = Math.floor(r / 10), u = r % 10; p.push(Dz[d] + (u ? ' e ' + U[u] : '')); } }
    return p.join(' e ');
  };
  const inteiro = n => {
    if (n === 0) return 'zero';
    const mi = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), r = n % 1000, p = [];
    if (mi) p.push(ate999(mi) + (mi === 1 ? ' milhão' : ' milhões'));
    if (mil) p.push(mil === 1 ? 'mil' : ate999(mil) + ' mil');
    if (r) p.push(ate999(r));
    if (p.length === 1) return p[0];
    const ult = p.pop();
    return p.join(', ') + ((r && r < 100) || r % 100 === 0 || !r ? ' e ' : ', ') + ult;
  };
  const reais = Math.floor(v + 1e-9), cents = Math.round((v - reais) * 100);
  const partes = [];
  if (reais > 0) partes.push(inteiro(reais) + (reais === 1 ? ' real' : ' reais'));
  if (cents > 0) partes.push(inteiro(cents) + (cents === 1 ? ' centavo' : ' centavos'));
  return partes.length ? partes.join(' e ') : 'zero real';
}
const validos  = r => { if (r.pago > 0) return { sinal:false, quit:false, total:true }; const tot = totalR(r), rest = Math.max(0, tot - r.sinal); return { sinal: r.sinal > 0, quit: r.quit && rest > 0, total: r.quit && tot > 0 }; };
const tipoPadrao = r => { const v = validos(r); return (v.quit && r.sinal > 0) ? 'quit' : v.total ? 'total' : 'sinal'; };
const estavel  = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v);
/* numeração fixa por aluguel (não depende de nenhum outro): à vista = ÚNICO, sinal = 01, quitação = 02 */

const dataLonga = iso => { const [y, m, d] = iso.split('-'); return (+d) + ' de ' + MESES[+m - 1].toLowerCase() + ' de ' + y; };

const HASH_KEY = 'pousada_belchior_hash';
const SESS_KEY = 'pousada_belchior_liberado';
const jaLiberado = () => { try { return !!sessionStorage.getItem(SESS_KEY); } catch (_) { return false; } };
const hexDe = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function derivarLocal(senha, salt, iter) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveBits']);
  return hexDe(await crypto.subtle.deriveBits({ name:'PBKDF2', salt, iterations:iter || 100000, hash:'SHA-256' }, k, 256));
}
async function salvarHash(senha) {
  try {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    localStorage.setItem(HASH_KEY, JSON.stringify({ s: hexDe(salt), i: 30000, h: await derivarLocal(senha, salt, 30000) }));
  } catch (_) {}
}
async function verificarLocal(senha) {
  try {
    const o = JSON.parse(localStorage.getItem(HASH_KEY) || 'null');
    if (!o) return false;
    const salt = new Uint8Array(o.s.match(/../g).map(x => parseInt(x, 16)));
    return (await derivarLocal(senha, salt, o.i)) === o.h;
  } catch (_) { return false; }
}
const temHash = () => { try { return !!localStorage.getItem(HASH_KEY); } catch (_) { return false; } };

/* ─── componente principal ───────────────────────────────────────────── */
function App() {
  const hoje = new Date();
  const [dados, setDados] = useState(loadDados);
  const [sessao, setSessao] = useState(NUVEM ? 'carregando' : 'ok');   /* carregando | deslogado | ok | semsdk */
  const [fbPronto, setFbPronto] = useState(!!fb);
  const [novaVersao, setNovaVersao] = useState(false);
  const [liberado, setLiberado] = useState(!NUVEM || jaLiberado());   /* a senha é pedida cada vez que o app é aberto */
  const [loginSenha, setLoginSenha] = useState('');
  const loginRef = React.useRef(null);
  const focarSenha = () => setTimeout(() => { if (loginRef.current) loginRef.current.focus(); }, 60);
  const [loginErro,  setLoginErro]  = useState('');
  const [entrando,   setEntrando]   = useState(false);
  const dadosRef   = React.useRef(dados); dadosRef.current = dados;
  const syncRef    = React.useRef(null);   /* id -> json já enviado/recebido (null até o 1º retorno da nuvem) */
  const cfgSyncRef = React.useRef('');
  const cfgPronto  = React.useRef(false);
  const numPendRef = React.useRef({});
  const [aba,   setAba]   = useState('casas');
  const [ano,   setAno]   = useState(hoje.getFullYear());
  const [mes,   setMes]   = useState(hoje.getMonth());
  const [toast, setToast] = useState(null);
  const [aberta, setAberta] = useState(null);
  const [lista,  setLista]  = useState(null);   /* 'alugueis' | 'pendentes' | null */
  const [recibo, setRecibo] = useState(null);   /* { id, tipo: 'sinal' | 'quit' | 'total' } | null */
  const [cfgAberto, setCfgAberto] = useState(false);
  const [assinando, setAssinando] = useState(false);
  /* data de hoje: reavaliada a cada minuto e ao voltar para o app, para virar sozinha à meia-noite */
  const [diaHoje, setDiaHoje] = useState(isoHoje());
  useEffect(() => {
    const atualiza = () => setDiaHoje(isoHoje());
    const t = setInterval(atualiza, 60000);
    document.addEventListener('visibilitychange', atualiza);
    window.addEventListener('focus', atualiza);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', atualiza); window.removeEventListener('focus', atualiza); };
  }, []);
  const [cfg, setCfg] = useState(() => {
    try { const x = JSON.parse(localStorage.getItem(EMIT_KEY) || 'null'); if (x) return x; } catch (_) {}
    return { nome:'Pousada Belchior', doc:'', end:'', cidade:'' };
  });
  const reciboRef = React.useRef(null);

  /* botão voltar do celular: qualquer tela fora do início empilha um passo no histórico */
  const pushedRef = React.useRef(false);
  const modalRef  = React.useRef(null);
  const empilhar = () => { if (pushedRef.current) return; try { history.pushState({ pb:1 }, ''); pushedRef.current = true; } catch (_) {} };
  const irInicio = () => { if (pushedRef.current) history.back(); else { setAberta(null); setLista(null); setAba('casas'); } };
  const abrirLista = tipo => { setLista(tipo); setAberta(null); empilhar(); window.scrollTo(0, 0); };
  const abrirRecibo = id => { const r = dados.find(x => x.id === id); setRecibo({ id, tipo: tipoPadrao(r) }); window.scrollTo(0, 0); };
  const fecharRecibo = () => { if (pushedRef.current) history.back(); else setRecibo(null); };
  const [modalExcluir, setModalExcluir] = useState(null);
  const [modalStatus, setModalStatus] = useState(null);   /* aluguel cujo status (pendente/quitado) vai mudar */
  const [senhaInput,   setSenhaInput]   = useState('');
  const [senhaErro,    setSenhaErro]    = useState(false);
  modalRef.current = modalExcluir || modalStatus;
  reciboRef.current = recibo;

  useEffect(() => {
    const onPop = () => {
      if (modalRef.current) {            /* voltar com o pedido de senha aberto: só fecha */
        setModalExcluir(null); setModalStatus(null); setSenhaInput(''); setSenhaErro(false);
        try { history.pushState({ pb:1 }, ''); pushedRef.current = true; } catch (_) {}
        return;
      }
      if (window.__pbForm) {              /* voltar com o formulário de lançamento aberto: fecha só o formulário */
        window.dispatchEvent(new Event('pb-fechar-form'));
        try { history.pushState({ pb:1 }, ''); pushedRef.current = true; } catch (_) {}
        return;
      }
      if (reciboRef.current) {           /* voltar com o recibo aberto: fecha o recibo e fica na tela anterior */
        setRecibo(null);
        try { history.pushState({ pb:1 }, ''); pushedRef.current = true; } catch (_) {}
        return;
      }
      pushedRef.current = false; setAberta(null); setLista(null); setAba('casas');
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  /* dados do emitente */
  useEffect(() => { try { localStorage.setItem(EMIT_KEY, JSON.stringify(cfg)); } catch (_) {} }, [cfg]);

  /* espera o Firebase terminar de carregar em segundo plano */
  useEffect(() => { fbPromise.then(() => { if (NUVEM && !fb) setSessao('semsdk'); setFbPronto(true); }); }, []);

  /* aviso de versão nova (o sw.js avisa quando o app guardado ficou diferente do publicado) */
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    const f = ev => { if (ev.data === 'nova-versao') setNovaVersao(true); };
    navigator.serviceWorker.addEventListener('message', f);
    return () => navigator.serviceWorker.removeEventListener('message', f);
  }, []);

  /* versão nova detectada: atualiza sozinho assim que for seguro (tela da senha, tela inicial, ou ao sair do app) */
  useEffect(() => {
    if (!novaVersao) return;
    const seguro = !liberado || (!aberta && !lista && !recibo && !modalExcluir && aba === 'casas');
    if (seguro) { location.reload(); return; }
    const f = () => { if (document.hidden) location.reload(); };
    document.addEventListener('visibilitychange', f);
    return () => document.removeEventListener('visibilitychange', f);
  }, [novaVersao, liberado, aberta, lista, recibo, modalExcluir, aba]);

  /* ── nuvem: login ── */
  useEffect(() => {
    if (!fb) return;
    return fb.auth.onAuthStateChanged(u => { setSessao(u ? 'ok' : 'deslogado'); if (!u) { syncRef.current = null; cfgPronto.current = false; } });
  }, [fbPronto]);

  /* ── nuvem: recebe os aluguéis (tempo real) ── */
  useEffect(() => {
    if (!fb || sessao !== 'ok') return;
    return fb.db.collection(COLECAO).onSnapshot(snap => {
      const lista = snap.docs.map(d => d.data());
      let migrado = false; try { migrado = !!localStorage.getItem(MIGRADO_KEY); } catch (_) {}
      try { localStorage.setItem(MIGRADO_KEY, '1'); } catch (_) {}
      if (syncRef.current === null && !migrado && lista.length === 0 && dadosRef.current.length > 0) {
        syncRef.current = new Map();      /* nuvem vazia na 1ª vez: sobe os dados que já estavam neste aparelho */
        setDados(d => [...d]);
        return;
      }
      syncRef.current = new Map(lista.map(r => [r.id, estavel(r)]));
      setDados(lista);
    }, () => setToast('⚠️ Sem acesso aos dados na nuvem'));
  }, [sessao]);

  /* ── nuvem: envia o que mudou (novo/alterado/excluído) ── */
  useEffect(() => {
    if (!fb || sessao !== 'ok' || syncRef.current === null) return;
    const mapa = syncRef.current, ids = new Set();
    dados.forEach(r => {
      ids.add(r.id);
      const j = estavel(r);
      if (mapa.get(r.id) !== j) { mapa.set(r.id, j); fb.db.collection(COLECAO).doc(r.id).set(r).catch(() => setToast('⚠️ Não foi possível salvar na nuvem')); }
    });
    [...mapa.keys()].forEach(id => { if (!ids.has(id)) { mapa.delete(id); fb.db.collection(COLECAO).doc(id).delete().catch(() => {}); } });
  }, [dados, sessao]);

  /* ── nuvem: dados do emitente compartilhados ── */
  useEffect(() => {
    if (!fb || sessao !== 'ok') return;
    return fb.db.doc('pousada_config/emitente').onSnapshot(sn => {
      cfgPronto.current = true;
      if (!sn.exists) { cfgSyncRef.current = ''; setCfg(c => ({ ...c })); return; }
      const d = sn.data(); cfgSyncRef.current = estavel(d); setCfg(d);
    }, () => {});
  }, [sessao]);
  useEffect(() => {
    if (!fb || sessao !== 'ok' || !cfgPronto.current) return;
    const j = estavel(cfg);
    if (j === cfgSyncRef.current) return;
    cfgSyncRef.current = j;
    fb.db.doc('pousada_config/emitente').set(cfg).catch(() => {});

        const txt = livres.length ? faixas.map(f => f[0] === f[1] ? p2(f[0]) : p2(f[0]) + ' a ' + p2(f[1])).join(' · ') : 'Sem vagas neste mês';
        return ce('div', { key:c.nome, style:{ background:'#fff', borderRadius:14, padding:16, marginBottom:12, boxShadow:'0 2px 12px rgba(0,0,0,.06)', borderTop:'4px solid ' + c.cor } },
          ce('div', { style:{ display:'flex', justifyContent:'space-between', alignItems:'baseline' } },
            ce('div', { style:{ fontWeight:700, fontSize:16, color:'#1a3a5c' } }, '🏠 ' + c.nome),
            ce('div', { style:{ fontSize:13, fontWeight:700, color: livres.length ? '#059669' : '#dc2626' } }, livres.length + (livres.length === 1 ? ' dia livre' : ' dias livres'))),
          ce('div', { style:{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(30px,1fr))', gap:4, margin:'12px 0' } },
            ...Array.from({ length:nDias }, (_, k) => ce('div', { key:k, style:{ textAlign:'center', padding:'5px 0', borderRadius:6, fontSize:11, fontWeight:700,
              background: ocu.has(k + 1) ? '#fee2e2' : '#ecfdf5', color: ocu.has(k + 1) ? '#dc2626' : '#059669' } }, k + 1))),
          ce('div', { style:{ fontSize:12, color:'#666' } }, ce('b', null, 'Livre: '), txt),
          ce('div', { style:{ fontSize:11, color:'#aaa', marginTop:4 } }, ocu.size + ' dia(s) ocupado(s)')
        );
      }),
      ce('div', { style:{ fontSize:11, color:'#999', textAlign:'center' } }, '🟩 livre   🟥 ocupado · conta do 1º ao último dia (00:00 às 23:59)'))
    );
  }

  /* ── modal: confirmar mudança de status com senha ── */
  function renderModalStatus() {
    if (!modalStatus) return null;
    const r = dados.find(x => x.id === modalStatus);
    if (!r) return null;
    const fechar = () => { setModalStatus(null); setSenhaInput(''); setSenhaErro(false); };
    return ce('div', { style:{ position:'fixed', inset:0, background:'rgba(0,0,0,.55)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:24 } },
      ce('div', { style:{ background:'#fff', borderRadius:16, padding:24, width:'100%', maxWidth:330, boxShadow:'0 8px 40px rgba(0,0,0,.25)' } },
        ce('div', { style:{ fontSize:28, textAlign:'center', marginBottom:6 } }, '⚠️'),
        ce('div', { style:{ fontWeight:700, fontSize:17, textAlign:'center', color:'#1a3a5c', marginBottom:8 } }, 'Tem certeza da mudança?'),
        ce('div', { style:{ fontSize:13, color:'#555', textAlign:'center', lineHeight:1.5, marginBottom:16 } },
          'O aluguel de ' + r.nome + ' (' + CASAS[r.casa].nome + ') vai de ' + (r.quit ? 'Quitado para Pendente' : 'Pendente para Quitado') + '. Digite a senha para concluir.'),
        ce(CampoSenha, { placeholder:'Senha', value:senhaInput, autoFocus:true,
          onChange:e => { setSenhaInput(e.target.value); setSenhaErro(false); },
          onKeyDown:e => { if (e.key === 'Enter') confirmarStatus(); },
          style:{ width:'100%', padding:'11px 14px', borderRadius:999, fontSize:15, textAlign:'center', border: senhaErro ? '2px solid #ef4444' : '2px solid #e5e7eb', outline:'none', marginBottom: senhaErro ? 6 : 16 } }),
        senhaErro && ce('div', { style:{ color:'#ef4444', fontSize:12, marginBottom:12, textAlign:'center' } }, '❌ Senha incorreta'),
        ce('div', { style:{ display:'flex', gap:10 } },
          ce('button', { onClick:fechar, style:{ flex:1, padding:11, borderRadius:999, border:'2px solid #e5e7eb', background:'#fff', color:'#555', fontSize:14, fontWeight:700, cursor:'pointer' } }, 'Cancelar'),
          ce('button', { onClick:confirmarStatus, style:{ flex:1, padding:11, borderRadius:999, border:'none', background:'linear-gradient(135deg,#1a3a5c,#0f2340)', color:'#fff', fontSize:14, fontWeight:700, cursor:'pointer' } }, 'Confirmar'))));
  }

  /* ── acesso: a senha é pedida toda vez que o app abre ── */
  const telaCheia = (...filhos) => ce('div', { style:{ minHeight:'100vh', background:'linear-gradient(rgba(0,20,40,.10), rgba(0,20,40,.28)), url("' + FOTO_ENTRADA + '") center / cover no-repeat, #0f2340', display:'flex', alignItems:'center', justifyContent:'center', padding:16 } },
    ce('div', { style:{ width:'100%', maxWidth:520, textAlign:'center', color:'#fff' } }, ...filhos));
  if (sessao === 'semsdk') return telaCheia(
    ce('div', { style:{ fontSize:32, marginBottom:8 } }, '📡'),
    ce('div', { style:{ fontSize:15, marginBottom:16 } }, 'Não foi possível carregar o app. Abra uma vez com internet.'),
    ce('button', { onClick:() => location.reload(), style:{ padding:'11px 22px', borderRadius:10, border:'none', background:'#fff', color:'#1a3a5c', fontSize:14, fontWeight:700, cursor:'pointer' } }, 'Tentar de novo'));
  if (!liberado) return telaCheia(
    ce('div', { style:{ fontSize:'calc((min(100vw, 520px) - 32px) / 10.6)', fontWeight:700, whiteSpace:'nowrap', lineHeight:1.1, textShadow:'0 2px 12px rgba(0,0,0,.8), 0 0 3px rgba(0,0,0,.7)' } }, 'Pousada Belchior'),
    ce('div', { style:{ color:'#fff', fontWeight:700, fontSize:15, letterSpacing:2, margin:'8px 0 20px', textShadow:'0 2px 10px rgba(0,0,0,.8), 0 0 3px rgba(0,0,0,.7)' } }, 'Balneário Magistério'),
    ce('div', { style:{ maxWidth:340, margin:'0 auto', border:'2px solid #fbbf24', borderRadius:36, padding:'16px 18px 18px', background:'rgba(8,30,50,.30)', backdropFilter:'blur(2px)', WebkitBackdropFilter:'blur(2px)' } },
      ce('div', { style:{ fontSize:'clamp(15px, 4.8vw, 19px)', fontWeight:800, letterSpacing:2, whiteSpace:'nowrap', textTransform:'uppercase', color:'#fbbf24', marginBottom:14, textShadow:'0 2px 8px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.7)' } }, '🔒 Área restrita'),
      ce(CampoSenha, { ref:loginRef, placeholder:'Senha de acesso', value:loginSenha, autoFocus:true, enterKeyHint:'go',
        onChange:e => { setLoginSenha(e.target.value); setLoginErro(''); },
        onKeyDown:e => { if (e.key === 'Enter') desbloquear(); },
        style:{ width:'100%', padding:'13px 14px', borderRadius:999, fontSize:16, border:'none', outline:'none', textAlign:'center', marginBottom:10 } }),
      loginErro && ce('div', { style:{ color:'#fecaca', fontSize:13, marginBottom:10 } }, '❌ ' + loginErro),
      ce('button', { onClick:desbloquear, disabled:entrando, style:{ width:'100%', padding:13, borderRadius:999, border:'none', background:'#fbbf24', color:'#1a3a5c', fontSize:15, fontWeight:700, cursor:'pointer', opacity: entrando ? .6 : 1 } }, entrando ? 'Entrando…' : 'Entrar')));

  /* ── root ── */
  if (recibo) return renderRecibo();
  const congelado = true;   /* em todas as telas: cabeçalho e abas fixos, só o conteúdo rola */
  return ce('div', { className: congelado ? 'app-frozen' : undefined, style: congelado ? { background:'#F8F5F0' } : { minHeight:'100vh', background:'#F8F5F0', paddingBottom:32 } },
    toast && ce(Toast, { key:toast, msg:toast, onDone:() => setToast(null) }),
    modalExcluir && ce('div', { style:{ position:'fixed', inset:0, background:'rgba(0,0,0,.55)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:24 } },
      ce('div', { style:{ background:'#fff', borderRadius:16, padding:28, width:'100%', maxWidth:320, boxShadow:'0 8px 40px rgba(0,0,0,.25)' } },
        ce('div', { style:{ fontSize:28, textAlign:'center', marginBottom:8 } }, '🔒'),
        ce('div', { style:{ fontWeight:700, fontSize:17, textAlign:'center', color:'#1a3a5c', marginBottom:6 } }, 'Confirmar exclusão'),
        ce('div', { style:{ fontSize:13, color:'#666', textAlign:'center', marginBottom:20 } }, 'Digite a senha para apagar este lançamento.'),
        ce(CampoSenha, { placeholder:'Senha', value:senhaInput, autoFocus:true,
          onChange:e => { setSenhaInput(e.target.value); setSenhaErro(false); },
          onKeyDown:e => { if (e.key === 'Enter') confirmarExclusao(); },
          style:{ width:'100%', padding:'11px 14px', borderRadius:9, fontSize:15, border: senhaErro ? '2px solid #ef4444' : '2px solid #e5e7eb', outline:'none', marginBottom: senhaErro ? 6 : 16 } }),
        senhaErro && ce('div', { style:{ color:'#ef4444', fontSize:12, marginBottom:12, textAlign:'center' } }, '❌ Senha incorreta'),
        ce('div', { style:{ display:'flex', gap:10 } },
          ce('button', { onClick:() => { setModalExcluir(null); setSenhaInput(''); setSenhaErro(false); },
            style:{ flex:1, padding:11, borderRadius:9, border:'2px solid #e5e7eb', background:'#fff', color:'#555', fontSize:14, fontWeight:700, cursor:'pointer' } }, 'Cancelar'),
          ce('button', { onClick:confirmarExclusao,
            style:{ flex:1, padding:11, borderRadius:9, border:'none', background:'linear-gradient(135deg,#dc2626,#b91c1c)', color:'#fff', fontSize:14, fontWeight:700, cursor:'pointer' } }, 'Apagar')))),
    renderModalStatus(),
    renderHeader(),
    congelado
      ? ce('div', { className:'app-frozen-body' },
          renderTabBar(),
          lista ? renderLista() : aba === 'vagas' ? renderVagas() : ce('div', { key: aberta ? 'det' + aberta.idx : 'casas', className:'scroll-area' }, renderCasas()))
      : ce('div', { style:{ maxWidth:700, margin:'14px auto 0', padding:'0 12px' } },
          renderTabBar(),
          lista ? renderLista() : aba === 'casas' ? renderCasas() : renderVagas())
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(ce(App, null));

/* abrir sem internet: o sw.js guarda o app e as bibliotecas no aparelho (só funciona pelo link https) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
